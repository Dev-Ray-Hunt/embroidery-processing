[project]
name = "coloring-up-engine"
version = "0.0.0"
description = "POC repo for the Coloring Up Engine — DST rendering, Madeira thread matching, color-up editor, and order workflow."
requires-python = ">=3.10"
dependencies = [
    "pyembroidery>=1.5",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pocs", "shared"]
python_files = ["test_*.py", "*_test.py"]
