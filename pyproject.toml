[project]
name = "coloring-up-engine"
version = "0.0.0"
description = "POC repo for the Coloring Up Engine — DST rendering, Madeira thread matching, color-up editor, and order workflow."
requires-python = ">=3.10"
dependencies = [
    "pyembroidery>=1.5",
    "pillow>=10.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pycairo>=1.29.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.60.0",
    "pytest>=8.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pocs", "shared"]
python_files = ["test_*.py", "*_test.py"]
# The project is not installed (tool.uv package = false), so put the repo root
# on sys.path for tests to import `pocs.*` / `shared.*`.
pythonpath = ["."]
